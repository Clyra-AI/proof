name: release-repair

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to repair
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  repair:
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      REPOSITORY_FULL_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf dist
          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --repo "${REPOSITORY_FULL_NAME}" \
            -D dist \
            --clobber
      - name: Verify downloaded release checksums
        run: ./scripts/verify_release_artifacts.sh dist
      - uses: anchore/sbom-action@v0
        with:
          artifact-name: release-repair-sbom
          output-file: dist/sbom.spdx.json
          upload-release-assets: false
      - name: Install grype
        uses: anchore/scan-action/download-grype@v4
      - name: Refresh grype database
        run: grype db update
      - name: Vulnerability scan (dist)
        run: grype dir:dist --fail-on high || grype dir:dist --fail-on critical
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt
      - name: Verify signed checksums
        run: ./scripts/verify_release_artifacts.sh dist
      - name: Upload missing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/upload_missing_release_assets.sh \
            "${RELEASE_TAG}" \
            "${REPOSITORY_FULL_NAME}" \
            dist/sbom.spdx.json \
            dist/checksums.txt.sig \
            dist/checksums.txt.pem
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-repair-artifacts
          path: |
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/sbom.spdx.json
