name: release-repair

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to repair
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE_TAG: v0.5.0
      EXPECTED_TARGET_SHA: e6af6d650e7c84d0ddb5831ced76a8633181f146
      RELEASE_TAG: ${{ inputs.tag }}
      REPOSITORY_FULL_NAME: ${{ github.repository }}
      TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
      COSIGN_CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Checkout target release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          path: release-source
      - name: Checkout trusted workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: trusted-source
      - name: Validate repair target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "${RELEASE_TAG}" == "${EXPECTED_RELEASE_TAG}" ]] || {
            echo "release repair is constrained to ${EXPECTED_RELEASE_TAG}, got ${RELEASE_TAG}" >&2
            exit 1
          }
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid release tag format: ${RELEASE_TAG}" >&2
            exit 1
          }
          [[ "$(git -C release-source rev-parse HEAD)" == "${EXPECTED_TARGET_SHA}" ]] || {
            echo "tag ${RELEASE_TAG} does not resolve to expected SHA ${EXPECTED_TARGET_SHA}" >&2
            exit 1
          }
          [[ "$(git -C trusted-source rev-parse HEAD)" == "${TRUSTED_WORKFLOW_SHA}" ]] || {
            echo "trusted workflow checkout does not match the workflow commit" >&2
            exit 1
          }
          release_json_path="$(mktemp)"
          gh release view "${RELEASE_TAG}" \
            --repo "${REPOSITORY_FULL_NAME}" \
            --json tagName,isDraft,isPrerelease,publishedAt,assets,url > "${release_json_path}"
          RELEASE_JSON_PATH="${release_json_path}" python3 <<'PY'
          import json
          import os
          import sys

          with open(os.environ["RELEASE_JSON_PATH"], "r", encoding="utf-8") as fh:
              data = json.load(fh)

          if data["tagName"] != os.environ["EXPECTED_RELEASE_TAG"]:
              raise SystemExit(f"release tag mismatch: {data['tagName']}")
          if data.get("isDraft") or data.get("isPrerelease"):
              raise SystemExit("release must be published and non-prerelease")
          if not data.get("publishedAt"):
              raise SystemExit("release must already be published")

          expected_assets = {
              "checksums.txt",
              "checksums.txt.sig",
              "checksums.txt.pem",
              "proof_0.5.0_darwin_amd64.tar.gz",
              "proof_0.5.0_darwin_arm64.tar.gz",
              "proof_0.5.0_linux_amd64.tar.gz",
              "proof_0.5.0_linux_arm64.tar.gz",
              "proof_0.5.0_windows_amd64.zip",
              "proof_0.5.0_windows_arm64.zip",
              "sbom.spdx.json",
          }
          signature_assets = {"checksums.txt.sig", "checksums.txt.pem"}
          names = [asset.get("name") for asset in data["assets"]]
          if any(not isinstance(name, str) for name in names) or len(names) != len(set(names)):
              raise SystemExit("release assets must have unique string names")
          actual_assets = set(names)
          base_assets = expected_assets - signature_assets
          if actual_assets not in (base_assets, expected_assets):
              missing = sorted(expected_assets - actual_assets)
              extra = sorted(actual_assets - expected_assets)
              raise SystemExit(f"release asset set mismatch: missing={missing}, extra={extra}")
          print(f"validated published release {data['url']}")
          PY
      - uses: actions/setup-go@v5
        with:
          go-version-file: trusted-source/go.mod
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf dist
          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --repo "${REPOSITORY_FULL_NAME}" \
            -D dist
      - name: Verify downloaded release asset digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_json_path="$(mktemp)"
          gh release view "${RELEASE_TAG}" \
            --repo "${REPOSITORY_FULL_NAME}" \
            --json isDraft,isPrerelease,publishedAt,assets > "${release_json_path}"
          python3 trusted-source/scripts/check_release_asset_set.py \
            "${release_json_path}" dist 0.5.0 --allow-missing --require-published
      - name: Verify downloaded release checksums
        env:
          COSIGN_CERT_IDENTITY: https://github.com/Clyra-AI/proof/.github/workflows/release.yml@refs/tags/v0.5.0
          COSIGN_CERT_ISSUER: https://token.actions.githubusercontent.com
        run: ./trusted-source/scripts/verify_release_artifacts.sh dist
      - name: Install grype
        uses: anchore/scan-action/download-grype@v4
      - name: Vulnerability scan (verified release contents)
        run: ./trusted-source/scripts/release_security_scan.sh dist
      - uses: sigstore/cosign-installer@v3
      - name: Determine checksum signature pair state
        id: signature_pair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t existing_assets < <(gh release view "${RELEASE_TAG}" --repo "${REPOSITORY_FULL_NAME}" --json assets --jq '.assets[].name')
          declare -A existing_map=()
          for asset_name in "${existing_assets[@]}"; do
            existing_map["${asset_name}"]=1
          done

          sig_exists=0
          pem_exists=0
          [[ -n "${existing_map[checksums.txt.sig]:-}" ]] && sig_exists=1
          [[ -n "${existing_map[checksums.txt.pem]:-}" ]] && pem_exists=1

          if [[ ${sig_exists} -ne ${pem_exists} ]]; then
            echo "release has a partial checksum signature pair; manual repair is required" >&2
            exit 1
          fi

          if [[ ${sig_exists} -eq 1 ]]; then
            [[ -f dist/checksums.txt.sig && -f dist/checksums.txt.pem ]] || {
              echo "expected both downloaded signature assets to exist locally" >&2
              exit 1
            }
            echo "mode=verify_existing" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "mode=create_and_upload" >> "${GITHUB_OUTPUT}"
      - name: Verify existing checksum signature pair
        if: steps.signature_pair.outputs.mode == 'verify_existing'
        env:
          COSIGN_CERT_IDENTITY: https://github.com/Clyra-AI/proof/.github/workflows/release.yml@refs/tags/v0.5.0
          COSIGN_CERT_ISSUER: https://token.actions.githubusercontent.com
        run: ./trusted-source/scripts/verify_release_artifacts.sh dist
      - name: Create checksum signature pair
        if: steps.signature_pair.outputs.mode == 'create_and_upload'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          [[ ! -e dist/checksums.txt.sig && ! -e dist/checksums.txt.pem ]] || {
            echo "checksum signature assets already exist; refusing to overwrite" >&2
            exit 1
          }
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt
      - name: Verify newly created checksum signature pair
        if: steps.signature_pair.outputs.mode == 'create_and_upload'
        env:
          COSIGN_CERT_IDENTITY: https://github.com/${{ github.workflow_ref }}
          COSIGN_CERT_ISSUER: https://token.actions.githubusercontent.com
        run: ./trusted-source/scripts/verify_release_artifacts.sh dist
      - name: Upload checksum signature pair
        if: steps.signature_pair.outputs.mode == 'create_and_upload'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            dist/checksums.txt.sig \
            dist/checksums.txt.pem \
            --repo "${REPOSITORY_FULL_NAME}"
      - name: Verify final release asset state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_json_path="$(mktemp)"
          gh release view "${RELEASE_TAG}" \
            --repo "${REPOSITORY_FULL_NAME}" \
            --json isDraft,isPrerelease,publishedAt,assets > "${release_json_path}"
          python3 trusted-source/scripts/check_release_asset_set.py \
            "${release_json_path}" dist 0.5.0 --require-published
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/proof_0.5.0_darwin_amd64.tar.gz
            dist/proof_0.5.0_darwin_arm64.tar.gz
            dist/proof_0.5.0_linux_amd64.tar.gz
            dist/proof_0.5.0_linux_arm64.tar.gz
            dist/proof_0.5.0_windows_amd64.zip
            dist/proof_0.5.0_windows_arm64.zip
            dist/sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-repair-artifacts
          path: |
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/sbom.spdx.json
            dist/scan/*.log
