version: 2

project_name: proof

builds:
  - id: proof
    main: ./cmd/proof
    binary: proof
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: git

release:
  github:
    owner: Clyra-AI
    name: proof

brews:
  - name: proof
    repository:
      owner: Clyra-AI
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Clyra-AI/proof"
    description: "Deterministic proof records and offline verification CLI"
    license: "Apache-2.0"
    skip_upload: auto
